name: Publisher site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish creator-approved legal text to the configured Pages site
        type: boolean
        default: false
      approved_source_sha:
        description: Exact reviewed main commit SHA (required for publication)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: publisher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify source and legal content
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          if [ "$PUBLISH_REQUESTED" = true ]; then
            test "$EVENT_REF" = refs/heads/main
            test "$EVENT_ACTOR" = "$REPOSITORY_OWNER"
            test "$APPROVED_SOURCE_SHA" = "$EVENT_SHA"
            python3 scripts/build_site.py --publish
          else
            python3 scripts/build_site.py
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: publisher-review
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        with:
          path: dist/
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish approved source
        id: deployment
        uses: actions/deploy-pages@v4
